name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs_version }}-ci
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.4"
          - "30.2"

    steps:
      - uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          emacs --batch \
            --eval '(progn
              (require (quote package))
              (setq package-archives (quote (("gnu" . "https://elpa.gnu.org/packages/")
                                             ("nongnu" . "https://elpa.nongnu.org/nongnu/")
                                             ("melpa" . "https://melpa.org/packages/")
                                             ("elpaish" . "https://tychoish.github.io/elpaish/snapshot/"))))
              (package-initialize)
              (unless package-archive-contents (package-refresh-contents))
              (unless (package-installed-p 'f) (package-install 'f))
              (unless (package-installed-p 'xtdlib) (package-install 'xtdlib))
              (unless (package-installed-p 'annotated-completing-read) (package-install 'annotated-completing-read))
              (unless (package-installed-p 'eglot-test-at-point) (package-install 'eglot-test-at-point))
              (unless (package-installed-p 'mcpkit) (package-install 'mcpkit))
            )'

      - name: Run Tests
        run: |
          emacs --batch \
            --eval '(progn (require (quote package)) (package-initialize))' \
            -L . \
            $(find test -name "test-*.el" -exec echo -l {} \;) \
            -f ert-run-tests-batch-and-exit
